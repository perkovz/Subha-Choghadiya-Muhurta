<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Subha Choghadiya</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="search-container">
      <input type="text" id="city-search" placeholder="Search city..." autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
    <nav class="date-navigation" aria-label="Calculation day">
      <button id="prev-day" class="date-btn" type="button" aria-label="Previous day">Prev</button>
      <button id="today" class="date-btn" type="button" aria-pressed="true">Today</button>
      <button id="next-day" class="date-btn" type="button" aria-label="Next day">Next</button>
    </nav>
  </div>

  <div id="content" class="loading">Loading your location…</div>

  <footer class="data-source">Sun data by <a href="https://sunrise-sunset.org/" target="_blank" rel="noopener noreferrer">Sunrise-Sunset.org</a></footer>

  <script src="popup.js"></script>
</body>
</html>
